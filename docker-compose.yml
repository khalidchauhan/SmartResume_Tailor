services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartresume-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smartresume_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartresume_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
