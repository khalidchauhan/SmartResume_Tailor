server:
  port: 8080

spring:
  application:
    name: smart-resume-tailor
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartresume;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
  matching:
    qualification-threshold: 80
    weights:
      skills: 35
      experience: 30
      domain: 20
      education: 15

logging:
  level:
    com.smartresume.tailor: DEBUG
    org.springframework.web: INFO
